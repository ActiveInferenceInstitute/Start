name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every step below runs one arm of `uv run start-gate`; the arm definitions live
# in scripts/gate.py and are the only copy of each command. Run the same arm
# locally with `uv run start-gate <arm>`.
jobs:
  checks:
    name: checks (py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked project environment
        run: uv sync --all-extras --dev --locked

      - name: Lint
        run: uv run start-gate lint

      - name: Types
        run: uv run start-gate types

      - name: Artifact and output contracts
        run: uv run start-gate artifacts

      - name: CLI and GUI smoke
        run: uv run start-gate smoke

      - name: Dependency audit
        run: uv run start-gate audit

  test:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.11 runs the marker-selected fast arm; 3.12 runs the full suite with
          # the coverage floor, so the expensive coverage pass is not paid twice.
          - python-version: "3.11"
            gate-arm: fast
          - python-version: "3.12"
            gate-arm: full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked project environment
        run: uv sync --all-extras --dev --locked

      - name: Test
        run: uv run start-gate ${{ matrix.gate-arm }}

  docs:
    name: docs
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked project environment
        run: uv sync --all-extras --dev --locked

      - name: Build docs and validate links
        run: uv run start-gate docs

      - name: Verify generated gate numbers
        run: uv run start-gate numbers

  gnn-conformance:
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked project environment
        run: uv sync --all-extras --dev --locked

      - name: Check pinned GNN registration
        run: uv run start-gate gnn

      - name: Parse the pinned GNN exemplar
        run: uv run start-gate gnn-exemplar

  macos-smoke:
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked project environment
        run: uv sync --all-extras --dev --locked

      - name: Validate lock
        run: uv run start-gate lock

      - name: macOS smoke tests
        run: uv run start-gate smoke-macos

name: Release gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Shared checks call the same `start-gate` arms as CI. Only the publication
# floors below are specific to this manual workflow.
jobs:
  release-gate:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras --dev --locked

      - name: Types and dependency audit
        run: |
          uv run start-gate types
          uv run start-gate audit

      - name: Artifact provenance and offline fixture replay
        run: uv run start-gate artifacts

      - name: Publication provenance floor
        run: uv run python -m scripts.audit_artifacts --check --fail-on-unprovenanced

      - name: Publication output gate
        run: uv run python -m scripts.validate_outputs --check --publication

      - name: Release coverage floor
        run: uv run pytest --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=90 -q

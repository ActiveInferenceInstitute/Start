version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /examples/efe
    schedule:
      interval: weekly
    groups:
      efe-npm:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /examples/vfe
    schedule:
      interval: weekly
    groups:
      vfe-npm:
        patterns:
          - "*"
    cooldown:
      default-days: 7

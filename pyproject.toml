[project]
name = "start"
version = "0.1.0"
description = "Active Inference curriculum generator and visualization toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Active Inference Institute" }]
license = { text = "CC BY-SA 4.0" }
keywords = ["active inference", "curriculum", "research", "education", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
urls = { Repository = "https://github.com/ActiveInferenceInstitute/Start", Documentation = "https://activeinferenceinstitute.github.io/Start/" }
dependencies = [
  "openai>=3.41.0",
  "numpy>=2.2.6",
  "pandas>=2.3.3",
  "matplotlib>=3.10.9",
  "seaborn>=0.13.2",
  "scikit-learn>=1.7.2",
  "networkx>=3.4.2",
  "nltk>=3.10.4",
  "spacy>=3.8.18",
  "wordcloud>=1.9.6",
  "adjustText>=1.4.0",
  "scipy>=1.15.3",
  "GitPython>=3.2.1",
  "requests>=2.34.2",
  "python-dotenv>=1.2.4",
  "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src", "learning", "scripts"]

[project.optional-dependencies]
dev = [
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "black>=26.10.1",
  "ruff>=0.17.3",
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.7",
  "mypy>=2.4.1",
  "pip-audit>=2.10.1",
]

[project.scripts]
start-curriculum = "learning.curriculum_creation.generate_custom_curriculum:main"
start-curriculum-gui = "learning.curriculum_creation.generate_curriculum_gui:main"
start-clone = "src.repos.clone_repo:main"
start-gnn = "src.gnn.main:main"
start-audit-artifacts = "scripts.audit_artifacts:main"
start-curate-artifacts = "scripts.curate_artifacts:main"
start-regenerate-offline = "scripts.regenerate_offline_fixtures:main"
start-run-history = "scripts.run_history:main"
start-validate-outputs = "scripts.validate_outputs:main"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"learning/curriculum_creation/generate_curriculum_gui.py" = ["E501"]

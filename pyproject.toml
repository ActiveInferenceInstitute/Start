[project]
name = "start"
version = "0.1.0"
description = "Active Inference curriculum generator and visualization toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Active Inference Institute" }]
license = { text = "CC BY-SA 4.0" }
keywords = ["active inference", "curriculum", "research", "education", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
urls = { Repository = "https://github.com/ActiveInferenceInstitute/Start", Documentation = "https://activeinferenceinstitute.github.io/Start/" }
dependencies = [
  "openai>=1.30.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "scikit-learn>=1.4.0",
  "networkx>=3.2.1",
  "nltk>=3.8.1",
  "spacy>=3.7.2",
  "wordcloud>=1.9.3",
  "adjustText>=0.8",
  "scipy>=1.12.0",
  "GitPython>=3.1.43",
  "requests>=2.32.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src", "learning", "scripts"]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "black>=24.4",
  "ruff>=0.5",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mypy>=1.11",
  "pip-audit>=2.7",
]

[project.scripts]
start-curriculum = "learning.curriculum_creation.generate_custom_curriculum:main"
start-curriculum-gui = "learning.curriculum_creation.generate_curriculum_gui:main"
start-clone = "src.repos.clone_repo:main"
start-audit-artifacts = "scripts.audit_artifacts:main"
start-curate-artifacts = "scripts.curate_artifacts:main"
start-regenerate-offline = "scripts.regenerate_offline_fixtures:main"
start-run-history = "scripts.run_history:main"
start-validate-outputs = "scripts.validate_outputs:main"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"learning/curriculum_creation/generate_curriculum_gui.py" = ["E501"]

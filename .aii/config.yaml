# AII sidecar — InstituteOS metadata. Schema: aii_platform.aii_sidecar
meta:
  sidecar_version: 1.2.1
  updated: '2026-11-10'
repo:
  name: Start
  slug: start
  full_name: ActiveInferenceInstitute/Start
  description: START combines optional live research capabilities with sophisticated
    content generation to produce personalized educational materials for Active Inference
    and the Free Energy Principle. Every generated artifact carries an evidence status;
    synthetic foundation material is not presented as live research.
institute:
  category: research-software
  maturity: released
  steward: Active Inference Institute
ecosystem:
  relations:
  - repo: ActiveInferenceInstitute/InstituteOS
    relation: referenced-by
    note: Federated via the InstituteOS .aii manifest.
  - repo: ActiveInferenceInstitute/Active_Inference_Ontology
    note: Uses Active Inference Ontology terms.
  - repo: ActiveInferenceInstitute/pymdp
    relation: depends-on
    note: Consumes the pymdp active-inference library.
  links:
    github: https://github.com/ActiveInferenceInstitute/Start
    website: https://www.activeinference.org
artifacts:
- path: README.md
  kind: doc
  description: Repository overview.
- path: src
  kind: code
  description: Source tree.
- path: pyproject.toml
  kind: code
  description: Python package config.
- path: LICENSE
  kind: doc
  description: License.
- path: AGENTS.md
  kind: doc
  description: Agent guidance.
- path: tests
  kind: test
  description: Test suite.
- path: docs
  kind: doc
  description: Documentation tree.
provenance:
  license: CC-BY-SA-4.0
  citation:
    zenodo: https://zenodo.org/badge/latestdoi/903921695
    text: Active Inference Institute — Start.
instituteos:
